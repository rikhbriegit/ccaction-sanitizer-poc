name: WorkflowRun POC
on:
  workflow_run:
    workflows: ["CI Trigger", ".github/workflows/ci-trigger.yml"]
    types: [completed]
permissions:
  contents: write
  id-token: write
jobs:
  poc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream head sha
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Run Claude Code Action on untrusted head
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "List the top-level files in this repository"